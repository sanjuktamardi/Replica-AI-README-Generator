
services:
  replica:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: replica_db
      DB_USER: replica_user
      DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./.streamlit/secrets.toml:/replica-dir/.streamlit/secrets.toml:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: replica_db
      MYSQL_USER: replica_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
